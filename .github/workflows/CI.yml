# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: CloudSyncSession CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # Build with the runner's default Xcode rather than a separately installed
    # toolchain. The image must ship the macOS 26 SDK or later: ErrorMiddleware
    # switches over CKError.Code.participantAlreadyInvited, which does not
    # exist in earlier SDKs, so macos-15 (Xcode 16) fails to compile.
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v

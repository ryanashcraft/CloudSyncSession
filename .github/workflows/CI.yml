# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: CloudSyncSession CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # The macos-15 image's default Xcode toolchain ships Swift 6.x, which the
    # tools 6.0 manifest requires. swift-actions/setup-swift@v1 installs a
    # Swift 5.x toolchain and cannot build this package.
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v
